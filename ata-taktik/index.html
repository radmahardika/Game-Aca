<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATA Tactics">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1a44">
<title>Ata dan Madu Legendaris: Taktik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:rgba(16,24,50,.9);--navy2:rgba(8,12,28,.92);--gold:#d6be82;--gold2:#f2dca0;--cream:#eef2ff;--muted:#aab6dc;--dark:#060a1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1a44;font-family:Fredoka,system-ui,sans-serif;color:var(--cream);user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;touch-action:none;display:block}
.box,.hmid,.hturn,#panel .ucard,#panel .ctrl,.card,.dbox,#tip,.topbar,.node,.ccard{background:linear-gradient(180deg,rgba(24,34,68,.9),rgba(8,12,30,.92));border:1px solid rgba(214,190,130,.75);box-shadow:0 0 0 1px rgba(4,6,18,.9),inset 0 1px 0 rgba(255,240,200,.14),0 8px 24px rgba(0,0,0,.45);border-radius:3px}
.btn{font:600 16px Fredoka,sans-serif;color:var(--cream);background:linear-gradient(180deg,rgba(60,80,140,.55),rgba(20,30,64,.75));border:1px solid rgba(214,190,130,.55);border-radius:3px;padding:9px 14px;cursor:pointer;min-height:44px;text-shadow:0 1px 0 #0008;transition:filter .1s}
.btn:active{filter:brightness(1.25);transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#e6c983,#a98336);color:#20160a;text-shadow:none;border-color:#f6e4b0}
.btn.pri2{background:linear-gradient(180deg,#5e8ee0,#2c56a8);border-color:#a8c6ff}
.btn.warn{background:linear-gradient(180deg,#d9a84a,#9a6a1c);color:#1e1408;text-shadow:none;border-color:#f2d58a}
.btn.big{font-size:21px;padding:14px 28px}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.icon{min-width:44px;padding:6px 10px;font-size:18px}
.btn.icon.sm{min-width:38px;min-height:38px;font-size:17px;padding:4px 8px}
.btn.wide{width:100%}
.muted{color:var(--muted)}.small{font-size:13px}.pad{padding:0 16px}
.row{display:flex;gap:10px;justify-content:center;align-items:center}.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.chip{display:inline-block;background:rgba(214,190,130,.14);border:1px solid rgba(214,190,130,.45);border-radius:3px;padding:1px 6px;font-size:12px;margin:2px 3px 0 0;color:var(--gold2)}
.pt{display:block;flex:none;background:radial-gradient(circle at 40% 30%,#3e5c9a,#18284e);border:1px solid rgba(214,190,130,.7);border-radius:3px}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#hud[hidden],#panel[hidden]{display:none}
.hmid{flex:0 1 auto;min-width:0;max-width:52vw;padding:6px 12px}
.htitle{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hobj{font-size:13px;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsp{flex:1}
.hturn{text-align:center;line-height:1;padding:6px 12px}
.hturn small{display:block;font-size:11px;color:var(--muted)}.hturn b{font-size:22px}
.zoom{display:flex;gap:4px}

/* Panel bawah: kartu tokoh kiri, perintah kanan */
#panel{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:flex;gap:12px;align-items:flex-end;justify-content:space-between;pointer-events:none}
#panel>*{pointer-events:auto}
#panel .ucard{width:min(400px,46vw);margin:0}
#panel .ctrl{width:min(300px,44vw);padding:8px;margin-left:auto}
.pmsg{text-align:center;font-weight:600;padding:12px 18px;color:var(--gold2)}
.phint{font-size:13px;color:var(--gold2);text-align:center;margin:2px 4px 8px}
.btns{display:flex;flex-direction:column;gap:6px}
.btns .btn{width:100%;text-align:left;font-size:16px;padding:9px 12px}
.ucard{display:flex;gap:10px;align-items:center;padding:8px 10px}
.ucard.e .pt{background:radial-gradient(circle at 40% 30%,#8a4a3a,#3a1a14)}.ucard.n .pt{background:radial-gradient(circle at 40% 30%,#3a7a6a,#14342e)}
.ubody{flex:1;min-width:0}
.uname{font-weight:700;font-size:18px}.uname small{font-weight:500;color:var(--muted);font-size:12px}
.hpbar{position:relative;height:16px;background:var(--dark);border:1px solid #4a5f95;border-radius:2px;overflow:hidden;margin:4px 0}
.hpbar i{position:absolute;inset:0 auto 0 0}
.hpbar span{position:relative;display:block;line-height:14px;font-size:11px;font-weight:600;padding-left:6px;color:#fff;text-shadow:0 1px 0 #000}
.ustats{font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.sp .on{color:#ffd56a}.sp .off{color:#3a4466}
.skills{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.skill{display:flex;align-items:center;gap:8px;text-align:left;background:linear-gradient(180deg,rgba(60,80,140,.55),rgba(20,30,64,.75));border:1px solid rgba(214,190,130,.55);border-radius:3px;padding:6px 10px;font-family:Fredoka,sans-serif;color:var(--cream);cursor:pointer}
.skill.dim{opacity:.45}
.sicon{font-size:22px}.stext{flex:1}.stext b{display:block;font-size:15px}.stext small{font-size:12px;color:var(--muted)}
.scost{color:#ffd56a;font-size:13px;white-space:nowrap}
@media (max-width:700px){#panel{flex-direction:column;align-items:stretch}#panel .ucard,#panel .ctrl{width:auto}.btns{flex-direction:row;flex-wrap:wrap}.btns .btn{flex:1 1 40%;text-align:center}.hmid{max-width:none;flex:1}}

/* Banner & tips */
#banner{position:fixed;left:0;right:0;top:40%;text-align:center;font:700 34px Fredoka,sans-serif;letter-spacing:1px;color:#fff;text-shadow:0 2px 8px #000a;pointer-events:none;z-index:8;opacity:0;transform:scale(.8);transition:all .25s}
#banner.show{opacity:1;transform:scale(1)}
#banner.player{background:linear-gradient(90deg,transparent,rgba(40,90,180,.85) 25%,rgba(40,90,180,.85) 75%,transparent);padding:12px 0;border-top:1px solid rgba(160,200,255,.6);border-bottom:1px solid rgba(160,200,255,.6)}
#banner.enemy{background:linear-gradient(90deg,transparent,rgba(160,40,40,.85) 25%,rgba(160,40,40,.85) 75%,transparent);padding:12px 0;border-top:1px solid rgba(255,160,150,.6);border-bottom:1px solid rgba(255,160,150,.6)}
#banner.mission{background:linear-gradient(90deg,transparent,rgba(8,12,30,.92) 20%,rgba(8,12,30,.92) 80%,transparent);padding:14px 0;font-size:26px;color:var(--gold2);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
#tip{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translate(-50%,-10px);width:min(92vw,520px);display:flex;gap:8px;align-items:center;padding:10px 12px;font-size:15px;z-index:9;opacity:0;pointer-events:none;transition:all .2s}
#tip.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#tip span:nth-child(2){flex:1}
.tipi{font-size:22px}
.skillname{position:fixed;left:50%;top:26%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(24,34,68,.95),rgba(8,12,30,.95));color:var(--gold2);font:700 22px Fredoka,sans-serif;padding:8px 22px;border:1px solid var(--gold);border-radius:3px;z-index:8;animation:pop .3s ease-out;pointer-events:none;white-space:nowrap}
.flash{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy2);border:1px solid var(--gold);color:#fff;padding:10px 16px;border-radius:3px;z-index:30;font-size:14px;width:max-content;max-width:90vw}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}

/* Dialog cerita */
#dlg{position:fixed;inset:0;z-index:20;display:none;background:linear-gradient(transparent 40%,#000a)}
#dlg.show{display:block}
.dbox{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,700px);display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;animation:up .25s ease-out}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
.dtext{flex:1}.dname{font-weight:700;color:var(--gold2);font-size:18px}
.dtext p{margin:4px 0;font-size:19px;line-height:1.4}
.dnext{font-size:12px;color:var(--muted);text-align:right}
#dlg.narr .dtext p{font-style:italic}
.skip{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px}

/* Overlay */
#ov{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(2,6,20,.6);padding:16px}
#ov.show{display:flex}
.card{padding:20px;width:min(92vw,460px);max-height:90vh;overflow:auto;text-align:center;animation:pop2 .25s ease-out}
@keyframes pop2{from{transform:scale(.9);opacity:0}}
.card .col{margin-top:10px}
.rtitle{font-weight:700;font-size:30px;color:var(--gold2);margin-bottom:8px;letter-spacing:.5px}
.rtitle.sm{font-size:22px}
.result .pt,.recruit .pt{margin:0 auto}
.bigstars{font-size:46px;letter-spacing:4px;color:#2e3858}
.bigstars span.on{color:#ffd24a;display:inline-block;animation:star .4s both;text-shadow:0 0 14px rgba(255,210,80,.7)}
@keyframes star{from{transform:scale(0) rotate(-90deg)}}
.conds{list-style:none;padding:0;margin:8px 0;text-align:left;font-size:14px}
.conds li{padding:3px 0;color:#7f8bb0}.conds li.ok{color:#9be89a}
.madu{background:rgba(214,190,130,.12);border:1px solid rgba(214,190,130,.4);border-radius:3px;padding:8px;margin:8px 0;font-size:14px}
.switch{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(214,190,130,.35);border-radius:3px;padding:10px 12px;font-weight:600;text-align:left;margin:6px 0}
.switch input{width:22px;height:22px;accent-color:#d6be82}
.team{display:flex;justify-content:center;gap:10px;margin:8px 0}
.tm{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:4px}

/* Layar menu */
#scr{position:fixed;inset:0;z-index:10;overflow:auto;display:none;padding-bottom:30px;padding-top:env(safe-area-inset-top)}
#scr.on{display:block}
.title{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.title h1{margin:0;font-size:60px;line-height:1;color:var(--gold2);text-shadow:0 2px 0 #6a5420,0 6px 24px rgba(0,0,0,.6)}
.title h1 span{display:block;font-size:26px;color:var(--cream);font-weight:500;margin-top:6px}
.tsmall{font-weight:600;letter-spacing:2px;color:var(--gold);text-transform:uppercase;font-size:13px}
.trio{display:flex;align-items:flex-end;gap:10px;margin:8px 0}
.title .col{width:min(86vw,320px)}
.title p{max-width:460px;margin:4px 0}
.topbar{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:10px 12px;z-index:2;border-radius:0;border-left:0;border-right:0;border-top:0}
.ttl{flex:1;font-weight:700;font-size:21px}
.honey{background:rgba(214,190,130,.15);border:1px solid var(--gold);border-radius:3px;padding:4px 10px;font-weight:700;color:#ffd56a}
.maphead{display:flex;gap:8px;justify-content:space-between;padding:12px 16px;max-width:560px;margin:0 auto}
.path{position:relative;max-width:560px;margin:0 auto;padding:6px 16px 20px}
.path:before{content:'';position:absolute;left:50%;top:20px;bottom:30px;border-left:2px dashed rgba(214,190,130,.55);transform:translateX(-50%)}
.node{position:relative;display:flex;align-items:center;gap:10px;width:62%;margin:12px 0;padding:8px 10px;cursor:pointer}
.node.r{margin-left:38%;flex-direction:row-reverse;text-align:right}
.node .dot{flex:none;width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,#e6c983,#a98336);color:#20160a;display:flex;align-items:center;justify-content:center;font:700 20px Fredoka,sans-serif;box-shadow:0 0 0 2px rgba(4,6,18,.9),0 0 12px rgba(230,200,130,.4)}
.node.done .dot{background:linear-gradient(180deg,#8fd88a,#3a8a3a);color:#08200a}
.node.cur{border-color:var(--gold2);box-shadow:0 0 0 1px rgba(4,6,18,.9),0 0 18px rgba(240,210,140,.45);animation:bob 1.4s ease-in-out infinite}
.chars{display:grid;grid-template-columns:minmax(300px,1fr) 1.2fr;gap:14px;max-width:1100px;margin:10px auto 0;padding:0 14px;align-items:start}
.cleft{position:sticky;top:70px;display:flex;flex-direction:column;gap:8px}
.cstagebox{position:relative;height:min(52vh,420px);background:radial-gradient(ellipse at 50% 40%,rgba(60,90,160,.55),rgba(8,12,30,.2) 70%);border:1px solid rgba(214,190,130,.6);border-radius:3px;box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
.cstage{width:100%;height:100%;display:block}
.cpose{position:absolute;left:50%;top:10px;transform:translateX(-50%);font:700 16px Fredoka,sans-serif;color:var(--gold2);background:rgba(8,12,30,.75);border:1px solid rgba(214,190,130,.5);padding:3px 12px;border-radius:14px;white-space:nowrap}
.cposes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.cposes .btn{min-height:40px;padding:6px 10px;font-size:14px}
.cright{padding:14px 16px;text-align:left}
.cname{font:700 34px Fredoka,sans-serif;color:var(--gold2);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cjob{font-size:15px;color:#20160a;background:linear-gradient(180deg,#e6c983,#a98336);padding:2px 10px;border-radius:12px}
.clv{font-size:16px;color:var(--cream);margin-left:auto}
.canimal{color:var(--muted);font-size:14px;margin-top:2px}.cbio{margin:8px 0 4px;line-height:1.45}
.csec{margin:12px 0 6px;font:700 13px Fredoka,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);border-bottom:1px solid rgba(214,190,130,.35);padding-bottom:3px}
.sbar{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.sbar .st{height:10px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}.sbar .st i{display:block;height:100%;border-radius:5px}
.sbar b{text-align:right;color:var(--cream)}.crange{font-size:14px;margin-top:6px}
.cskills2{display:flex;flex-direction:column;gap:6px}.cskill{display:flex;gap:10px;align-items:flex-start;background:rgba(214,190,130,.08);border:1px solid rgba(214,190,130,.3);border-radius:3px;padding:6px 8px}
.cskill .sicon{font-size:24px}.cskill small{display:block;color:var(--muted);font-size:13px}.cskill .scost{color:#ffd24a;font-size:12px}
.cpass{margin:0;font-size:14px}.ctip{margin-top:10px;background:rgba(90,211,90,.1);border:1px solid rgba(90,211,90,.4);border-radius:3px;padding:8px 10px;font-size:14px}
.roster{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px;max-width:1100px;margin:0 auto}
.rpick{display:flex;flex-direction:column;align-items:center;gap:3px;background:linear-gradient(180deg,rgba(24,34,68,.9),rgba(8,12,30,.92));border:1px solid rgba(214,190,130,.5);border-radius:3px;padding:6px 8px;color:var(--cream);font:inherit;cursor:pointer;min-width:78px}
.rpick.on{border-color:var(--gold2);box-shadow:0 0 14px rgba(240,210,140,.55);transform:translateY(-3px)}
.rpick.locked{opacity:.5;cursor:default}.rpick .silh{width:58px;height:58px;display:flex;align-items:center;justify-content:center;font:700 26px Fredoka;color:var(--muted);background:rgba(255,255,255,.05);border-radius:3px}
.ptbtn{background:none;border:0;padding:0;color:var(--gold2);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit}
@media (max-width:760px){.chars{grid-template-columns:1fr}.cleft{position:static}.cstagebox{height:300px}.cname{font-size:28px}}
.tm.pk{position:relative;background:rgba(255,255,255,.04);border:1px solid rgba(214,190,130,.4);border-radius:3px;padding:6px;color:var(--cream);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tm.pk.on{border-color:var(--gold2);box-shadow:0 0 12px rgba(240,210,140,.5);background:rgba(214,190,130,.14)}.tm.pk.off{opacity:.5}
.tm .chk{position:absolute;top:2px;right:4px;color:#8cff8c;font-weight:700}
.pickinfo{font-weight:700;color:var(--gold2);margin:4px 0}.btn.dim{opacity:.5}
.chap{position:relative;z-index:1;margin:22px auto 4px;width:fit-content;padding:6px 16px;font:700 17px Fredoka,sans-serif;color:#f6e2a4;background:linear-gradient(180deg,#2a3a6e,#121a3a);border:1px solid rgba(214,190,130,.8);border-radius:20px;box-shadow:0 0 0 1px rgba(4,6,18,.9)}
.node.locked{opacity:.55;cursor:default}.node.locked .dot{background:#3a4466;color:#aab6dc;box-shadow:0 0 0 2px rgba(4,6,18,.9)}
@keyframes bob{50%{transform:translateY(-3px)}}
.ninfo{display:flex;flex-direction:column;min-width:0}
.ninfo b{font-size:17px}.ninfo small{color:var(--muted);font-size:12px}
.nst{color:#ffd56a;font-size:15px;letter-spacing:1px}
.cards{display:flex;flex-direction:column;gap:12px;padding:10px 16px;max-width:640px;margin:0 auto}
.ccard{display:flex;gap:12px;align-items:flex-start;padding:10px}
.ccard.locked{opacity:.6;align-items:center}
.silh{width:56px;height:56px;border-radius:3px;background:var(--dark);color:#3a4466;display:flex;align-items:center;justify-content:center;font:700 28px Fredoka,sans-serif;flex:none;border:1px solid #3a4466}
.ccard.locked small{display:block;color:var(--muted)}
.cbody{flex:1;display:flex;flex-direction:column;gap:6px}
.cstat{font-size:14px}
.ver{position:fixed;right:10px;bottom:8px;font-size:11px;color:var(--muted)}
@media (min-width:700px){.dtext p{font-size:20px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden></div>
<div id="panel" hidden></div>
<div id="banner"></div>
<div id="tip"></div>
<div id="scr"></div>
<div id="dlg"></div>
<div id="ov"></div>
<script src="js/audio.js?v=4"></script>
<script src="js/art.js?v=4"></script>
<script src="js/sprites.js?v=4"></script>
<script src="js/data.js?v=4"></script>
<script src="js/game.js?v=4"></script>
</body>
</html>
