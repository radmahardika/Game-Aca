<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mockup — Ata dan Pohon Madu Legendaris</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #12100e; overflow: hidden; font-family: 'Pixelify Sans', monospace; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1200px; height: 840px; transform-origin: 0 0; }
  canvas { position: absolute; inset: 0; width: 1200px; height: 840px; }
  .ui { position: absolute; color: #f7ecd2; text-shadow: 0 2px 0 #1a120c; }
  /* panel kayu-perkamen */
  .box { background: linear-gradient(#3b2a1e, #2a1d15); border: 3px solid #d8b56a; border-radius: 6px;
         box-shadow: 0 0 0 3px #2a1d15, inset 0 0 0 2px #6e5131, 0 6px 0 3px rgba(0,0,0,.35); }
  .lbl { font-size: 18px; color: #e9c879; letter-spacing: 1px; }
  /* bar giliran */
  #turn { left: 24px; top: 18px; padding: 8px 14px 8px 12px; display: flex; align-items: center; gap: 10px; }
  #turn .face { width: 54px; height: 54px; border-radius: 6px; background: #1d1510; border: 2px solid #6e5131; position: relative;
                display: grid; place-items: center; overflow: hidden; }
  #turn .face img { width: 50px; image-rendering: pixelated; }
  #turn .face.now { border-color: #ffd86b; box-shadow: 0 0 0 3px #ffd86b55, 0 0 14px #ffd86b; width: 66px; height: 66px; }
  #turn .face.now img { width: 62px; }
  #turn .face.foe { background: #3a1716; border-color: #8e3b33; }
  #turn .arrow { color: #b99a63; font-size: 20px; }
  #turn .face .mv { position: absolute; right: -2px; bottom: -2px; font-size: 16px; }
  /* musuh */
  #foes { right: 24px; top: 18px; padding: 10px 16px; min-width: 250px; }
  #foes .row { display: flex; justify-content: space-between; font-size: 24px; gap: 18px; margin-top: 4px; }
  #foes .tp { font-size: 17px; color: #cdb88d; }
  /* tim */
  #party { left: 24px; bottom: 16px; display: flex; gap: 12px; }
  .card { flex: 0 0 214px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; }
  .card .por { flex: none; width: 70px; height: 84px; background: #6d8f4e; border: 2px solid #1a120c; border-radius: 4px; display: grid; place-items: center; overflow: hidden; }
  .card .por img { width: 84px; image-rendering: pixelated; margin-top: 10px; }
  .card .nm { font-size: 22px; font-weight: 700; display: flex; justify-content: space-between; }
  .card .nm small { font-size: 17px; color: #e9c879; font-weight: 500; }
  .card .job { font-size: 15px; white-space: nowrap; color: #cdb88d; margin-top: -2px; }
  .bar { margin-top: 5px; display: flex; align-items: center; gap: 6px; font-size: 18px; }
  .bar b { width: 32px; color: #ffcf6e; }
  .bar .t { flex: 1; height: 10px; background: #1a120c; border-radius: 3px; border: 1px solid #000; overflow: hidden; }
  .bar .t i { display: block; height: 100%; }
  .bar span { width: 62px; text-align: right; }
  .hp i { background: linear-gradient(#8ee66a, #3ea83a); } .mp i { background: linear-gradient(#a98af2, #6a46c9); }
  .card.now { border-color: #ffd86b; box-shadow: 0 0 0 3px #2a1d15, 0 0 0 6px #ffd86b88, 0 6px 0 3px rgba(0,0,0,.35); }
  .card.lock { opacity: .78; filter: saturate(.4); }
  .card.lock .por { background: #2a221b; color: #6e5a40; font-size: 54px; font-weight: 700; }
  /* menu aksi */
  #menu { right: 24px; bottom: 16px; padding: 8px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; width: 342px; }
  .btn { background: #4a3626; border: 2px solid #8a6a40; border-radius: 6px; padding: 4px 2px 6px; font-size: 20px; display: flex; flex-direction: column; align-items: center; position: relative; }
  .btn .ic { font-size: 30px; }
  .btn.sel { background: #7a5a2c; border-color: #ffd86b; box-shadow: 0 0 10px #ffd86b88; }
  .btn.sel::before { content: '▶'; color: #ffd86b; font-size: 16px; position: absolute; left: 6px; top: 6px; }
  /* daftar jurus */
  #jurus { right: 24px; bottom: 192px; width: 372px; padding: 12px 14px; }
  #jurus .j { display: grid; grid-template-columns: 1fr auto; padding: 7px 10px; border-radius: 5px; margin-top: 6px; }
  #jurus .j b { font-size: 24px; } #jurus .j i { font-style: normal; font-size: 17px; color: #e9c879; }
  #jurus .j .mpc { grid-row: span 2; align-self: center; font-size: 20px; color: #c3adff; }
  #jurus .j.sel { background: #6a4c25; outline: 2px solid #ffd86b; }
  #jurus .j.off { opacity: .45; }
  #jurus .desc { margin-top: 10px; font-size: 18px; color: #f1e3c2; background: #1d1510; padding: 8px 10px; border-radius: 4px; line-height: 1.25; }
  /* niat musuh */
  .intent { position: absolute; transform: translate(-50%, -100%); background: #fff7e0; color: #2a1d15; border: 3px solid #2a1d15;
            border-radius: 18px; padding: 3px 10px 3px 8px; font-size: 22px; font-weight: 700; text-shadow: none; white-space: nowrap; }
  .intent::after { content: ''; position: absolute; left: 50%; bottom: -11px; margin-left: -7px; border: 7px solid transparent; border-top-color: #2a1d15; }
  .intent.big { background: #ffd0b8; animation: pulse .8s infinite alternate; }
  @keyframes pulse { to { transform: translate(-50%, -100%) scale(1.08); } }
  .tipe { position: absolute; transform: translate(-50%, 0); font-size: 16px; background: #1a120cdd; padding: 1px 7px; border-radius: 8px; color: #f1e3c2; text-shadow: none; }
  /* pesan */
  #msg { left: 24px; top: 108px; padding: 10px 18px; font-size: 23px; max-width: 760px; }
  #msg em { color: #ffd86b; font-style: normal; }
  .dmg { position: absolute; font-size: 54px; font-weight: 700; color: #fff; text-shadow: 0 3px 0 #2a1d15, 3px 0 0 #2a1d15, -3px 0 0 #2a1d15, 0 -3px 0 #2a1d15; }
  .dmg small { display: block; font-size: 24px; color: #ffd86b; text-align: center; margin-top: -8px; }
  /* jelajah */
  #area { left: 24px; top: 18px; padding: 10px 18px; font-size: 26px; }
  #area small { display: block; font-size: 17px; color: #cdb88d; }
  #dompet { right: 24px; top: 18px; padding: 10px 16px; font-size: 26px; display: flex; gap: 18px; align-items: center; }
  .tag { position: absolute; transform: translate(-50%, -100%); font-size: 18px; padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
  #stick { left: 120px; bottom: 90px; width: 150px; height: 150px; border-radius: 50%; border: 4px solid #ffffff55; background: #ffffff18; }
  #stick::after { content: ''; position: absolute; left: 70px; top: 30px; width: 64px; height: 64px; border-radius: 50%; background: #ffffff66; border: 3px solid #ffffffaa; }
  #btnA { right: 70px; bottom: 80px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(#ffcf6e, #c98a2a); border: 5px solid #fff3d1;
          display: grid; place-items: center; font-size: 52px; font-weight: 700; color: #4a2a0c; text-shadow: none; box-shadow: 0 0 20px #ffcf6e; }
  #btnTim { right: 24px; top: 96px; padding: 8px 14px; font-size: 22px; }
  #label { position: fixed; left: 8px; bottom: 6px; color: #fff8; font: 13px monospace; }
  .spr { position: absolute; image-rendering: auto; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
  .spr.px { image-rendering: pixelated; }
  .spr.flip { transform: scaleX(-1); }
  #sabuk { left: 50%; top: 50%; transform: translate(-50%,-50%); padding: 20px 26px; text-align: center; }
  #sabuk h2 { margin: 0 0 6px; font-size: 34px; color: #ffd86b; }
  #sabuk .row { display: flex; gap: 14px; align-items: flex-end; }
  #sabuk .it { width: 150px; }
  #sabuk .it img { height: 210px; }
  #sabuk .it b { display: block; font-size: 24px; } #sabuk .it span { font-size: 18px; color: #cdb88d; }
  #sabuk p { font-size: 20px; color: #f1e3c2; margin: 14px 0 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" width="1200" height="840"></canvas></div>
<script src="lowpoly.js"></script>
<script>
const stage = document.getElementById('stage');
const q = new URLSearchParams(location.search).get('s') || 'pilih';
const g = cv.getContext('2d');

// ---- sabuk: warna diganti saat runtime (piksel gelap netral di area sabuk) ----
const BELT = {
  putih: ['#9f9a90', '#f3efe6'], kuning: ['#a47410', '#ffd84a'], hijau: ['#2c6a22', '#79c95a'],
  biru: ['#1d3f8a', '#5f95ec'], merah: ['#7a1414', '#e24a3e'], hitam: null,
};
const BELT_AREA = {   // kotak area sabuk per pose (koordinat gambar)
  siaga: [[66, 138, 160, 248]], tendang: [[97, 122, 174, 166], [100, 160, 130, 212]],
  kanan: [[57, 165, 178, 236]], depan: [[55, 165, 152, 258]],
};
const IMG = {};
function load(n) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[n] = i; r(); }; i.src = '../img/' + (n.includes('/') ? n : 'ata/' + n) + (n.endsWith('.jpg') ? '' : '.png'); }); }
// latar dari pengguna: buang label di atas, lalu isi penuh layar (cover)
function bg(n, fy = 0.5, top = 58) {
  const im = IMG['latar/' + n + '.jpg'], w = im.width, h = w * 840 / 1200, y = top + (im.height - top - h) * fy;
  g.imageSmoothingQuality = 'high'; g.drawImage(im, 0, y, w, h, 0, 0, 1200, 840);
}
function hex(h) { return [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); }
function ata(pose, belt) {
  const im = IMG[pose], c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0);
  const ramp = BELT[belt]; if (!ramp || !BELT_AREA[pose]) return c.toDataURL();
  const d = x.getImageData(0, 0, c.width, c.height), a = d.data, lo = hex(ramp[0]), hi = hex(ramp[1]);
  for (const [x0, y0, x1, y1] of BELT_AREA[pose]) for (let y = y0; y < y1; y++) for (let xx = x0; xx < x1; xx++) {
    const i = (y * c.width + xx) * 4, r = a[i], gg = a[i + 1], b = a[i + 2];
    if (a[i + 3] < 60 || Math.max(r, gg, b) >= 92 || r - b > 5 || Math.abs(r - gg) >= 12) continue;
    const t = Math.min(1, Math.max(0, ((r + gg + b) / 3 - 28) / 55));
    for (let k = 0; k < 3; k++) a[i + k] = lo[k] + (hi[k] - lo[k]) * t;
  }
  x.putImageData(d, 0, 0); return c.toDataURL();
}
function img(src, x, y, h, cls) { const i = document.createElement('img'); i.src = src; i.className = 'spr ' + (cls || ''); Object.assign(i.style, { left: x + 'px', top: y + 'px', height: h + 'px' }); stage.appendChild(i); return i; }
function shadow(x, y, rx) { LP.softShadow(g, x, y, rx, rx * 0.3, 0.45); }
function char(n, fx, fy, h, flip) { const im = IMG[n], w = im.width * h / im.height; return img(n.includes('/') ? IMG[n].src : null, fx - w / 2, fy - h, h, flip ? 'flip' : ''); }
function ui(html, cls, style) { const d = document.createElement('div'); d.className = 'ui ' + (cls || ''); d.innerHTML = html; if (style) Object.assign(d.style, style); stage.appendChild(d); return d; }
const at = (x, y) => ({ left: x + 'px', top: y + 'px' });

function fit() { const s = Math.min(innerWidth / 1200, innerHeight / 840); stage.style.transform = `scale(${s}) translate(-50%, -50%)`; }
addEventListener('resize', fit); fit();

const BELT_NOW = 'kuning';
function card(por, nm, lv, job, hp, hpm, mp, mpm, now) {
  return `<div class="box card ${now ? 'now' : ''}"><div class="por"><img src="${por}" style="width:96px;margin-top:6px;image-rendering:auto"></div>
    <div style="flex:1"><div class="nm">${nm} <small>Lv ${lv}</small></div><div class="job">${job}</div>
    <div class="bar hp"><b>HP</b><div class="t"><i style="width:${hp / hpm * 100}%"></i></div><span>${hp}/${hpm}</span></div>
    <div class="bar mp"><b>MP</b><div class="t"><i style="width:${mp / mpm * 100}%"></i></div><span>${mp}/${mpm}</span></div></div></div>`;
}
function partyCards(now, mp) {
  const p = ui('', '', {}); p.id = 'party';
  p.innerHTML = card(ata('wajah'), 'Ata', 6, 'Taekwondoin · 🟨 Kuning', 47, 60, mp, 16, now)
    + card(IMG['ladhia/wajah'].src, 'Ladhia', 6, 'Paladin', 88, 96, 4, 6)
    + card(IMG['bubunti/wajah'].src, 'Bubunti', 5, 'Chef', 38, 44, 22, 30);
}

function battleBase(hit) {
  bg('hutan-pinggir', 0.55);
  // musuh (kiri, menghadap kanan)
  shadow(140, 412, 82); char('musuh/kumbang-2', 140, 420, 118);
  shadow(190, 602, 82); char('musuh/kumbang-2', 190, 610, 118);
  const tw = hit ? [340, 370] : [300, 380];
  shadow(tw[0], tw[1], 44); char('musuh/tawon-4', tw[0], tw[1] - 62, 140);
  // tim (kanan, menghadap kiri)
  // ukuran: Bubunti 150, Ata = 3/4 Bubunti, Ladhia besar
  if (hit) { shadow(482, 338, 40); img(ata('tendang', BELT_NOW), 400, 338 - 122, 122, 'flip'); }
  else { shadow(700, 318, 34); img(ata('siaga', BELT_NOW), 700 - 47, 318 - 113, 113, 'flip'); }
  const lx = hit ? 570 : 505, ly = hit ? 615 : 565;
  shadow(lx, ly, 96); img(IMG['ladhia/siaga'].src, lx - 186, ly - 264, 264, 'flip');
  const bx = hit ? 840 : 715, by = hit ? 520 : 690; shadow(bx, by, 44); img(IMG['bubunti/siaga'].src, bx - 82, by - 150, 150, 'flip');
  ui('💥 Kumpul tenaga', 'intent big', at(145, 308));
  ui('⚔️', 'intent', at(195, 499));
  if (!hit) ui('⚔️', 'intent', at(tw[0] + 100, tw[1] - 120));
  ui('🪨 Keras', 'tipe', at(140, 422)); ui('🪨 Keras', 'tipe', at(190, 612)); if (!hit) ui('🪶 Lincah', 'tipe', at(tw[0], tw[1] + 12));
  const faces = { a: ata('wajah'), k: IMG['musuh/kumbang-1'].src, t: IMG['musuh/tawon-1'].src, l: IMG['ladhia/wajah'].src, b: IMG['bubunti/wajah'].src };
  const order = hit ? [['k', 'now'], ['b'], ['l'], ['k'], ['t', '', '⬇']] : [['a', 'now'], ['t'], ['b'], ['k'], ['l'], ['k']];
  ui('<span class="lbl">GILIRAN</span>' + order.map(([k, c, mv], i) =>
    (i ? '<span class="arrow">›</span>' : '') + `<div class="face ${c || ''} ${'ktb'.includes(k) && k !== 'b' ? 'foe' : ''}"><img src="${faces[k]}" style="image-rendering:auto">${mv ? `<span class="mv">${mv}</span>` : ''}</div>`).join(''), 'box', {}).id = 'turn';
  ui('<div class="lbl">MUSUH</div><div class="row"><span>Tawon Nakal</span><span>×1</span></div><div class="row"><span>Kumbang Batu</span><span>×2</span></div>', 'box', {}).id = 'foes';
}

Promise.all(['siaga', 'tendang', 'kanan', 'depan', 'wajah', 'ladhia/siaga', 'ladhia/wajah', 'ladhia/kanan', 'bubunti/siaga', 'bubunti/wajah', 'bubunti/kanan', 'musuh/kumbang-1', 'musuh/kumbang-2', 'musuh/tawon-1', 'musuh/tawon-4', 'musuh/raja-kumbang-2', 'musuh/raja-kumbang-1', 'ladhia/bertahan', 'latar/hutan-pinggir.jpg', 'latar/lembah-kerikil.jpg', 'latar/rawa-kabut.jpg'].map(load)).then(() => {
if (q === 'pilih') {
  battleBase(false);
  partyCards(true, 12);
  ui(`<div class="btn"><span class="ic">⚔️</span>Serang</div><div class="btn sel"><span class="ic">✨</span>Jurus</div><div class="btn"><span class="ic">🛡️</span>Bertahan</div><div class="btn"><span class="ic">🎒</span>Bekal</div><div class="btn"><span class="ic">🔄</span>Tukar</div><div class="btn"><span class="ic">🏃</span>Kabur</div>`, 'box', {}).id = 'menu';
  ui(`<div class="lbl">JURUS ATA</div>
    <div class="j"><b>Tendangan Depan</b><span class="mpc">2 MP</span><i>Ap Chagi · 앞차기</i></div>
    <div class="j sel"><b>Tendangan Samping</b><span class="mpc">3 MP</span><i>Yeop Chagi · 옆차기</i></div>
    <div class="j off"><b>Tendangan Putar</b><span class="mpc">Lv 7</span><i>Dollyeo Chagi · 돌려차기</i></div>
    <div class="desc">Tendang musuh sampai <b style="color:#ffd86b">mundur di urutan giliran</b>. Cocok untuk menunda musuh yang 💥 kumpul tenaga!</div>`, 'box', {}).id = 'jurus';
  ui('Kumbang Batu sedang <em>💥 kumpul tenaga</em>! Pukulannya besar giliran depan.', 'box', {}).id = 'msg';
} else if (q === 'serang') {
  battleBase(true);
  partyCards(false, 9);
  const c2 = document.createElement('canvas'); c2.width = 1200; c2.height = 840; c2.style.pointerEvents = 'none'; stage.appendChild(c2);
  const h = c2.getContext('2d'); h.strokeStyle = '#fff6d6'; h.lineWidth = 5; h.globalAlpha = .85;
  for (let i = 0; i < 3; i++) { h.beginPath(); h.arc(450, 262, 34 + i * 12, Math.PI * 0.78, Math.PI * 1.22); h.stroke(); }
  h.globalAlpha = 1; h.fillStyle = '#fff3b0'; h.beginPath(); h.arc(404, 236, 20, 0, 7); h.fill(); h.fillStyle = '#fff'; h.beginPath(); h.arc(404, 236, 11, 0, 7); h.fill();
  ui('24<small>AMPUH!</small>', 'dmg', at(545, 200));
  ui('Ata: <em>Tendangan Samping!</em> &nbsp;Tawon Nakal terdorong ke belakang antrean ⬇', 'box', {}).id = 'msg';
} else if (q === 'jelajah') {
  bg('hutan-pinggir', 0.55);
  shadow(735, 215, 58); char('musuh/kumbang-2', 735, 222, 88);
  shadow(455, 725, 40); img(IMG['bubunti/kanan'].src, 455 - 38, 725 - 140, 140);
  shadow(565, 575, 58); img(IMG['ladhia/kanan'].src, 565 - 76, 575 - 238, 238);
  shadow(705, 330, 28); img(ata('kanan', BELT_NOW), 705 - 31, 330 - 105, 105);
  const mx = 330, my = 600;
  LP.softShadow(g, mx, my + 12, 16, 5); LP.facet(g, mx, my, 13, 12, '#d0912e', { n: 8, k: .35 }); LP.facet(g, mx - 2, my - 13, 9, 4, '#7a5538', { n: 6 });
  g.fillStyle = '#fff'; [[mx + 20, my - 16], [mx - 20, my - 8], [mx + 16, my + 8]].forEach(([x, y]) => { g.fillRect(x - 1, y - 5, 2, 10); g.fillRect(x - 5, y - 1, 10, 2); });
  ui('Hutan Pinggir<small>Bab 2 · Menuju Desa Embun</small>', 'box', {}).id = 'area';
  ui('<span>🪙 35</span><span>🍯 3</span>', 'box', {}).id = 'dompet';
  ui('👥 Tim', 'box', {}).id = 'btnTim';
  ui('🪨 Kumbang Batu · <b style="color:#ffd86b">Lv 2</b>', 'box tag', at(735, 120));
  ui('Dekati dari belakang = <b style="color:#ffd86b">Serangan Kejutan!</b>', 'box tag', at(940, 250));
  ui('', '', {}).id = 'stick';
  ui('A', '', {}).id = 'btnA';
} else if (q === 'bos') {
  bg('lembah-kerikil', 0.6);
  shadow(175, 590, 160); char('musuh/raja-kumbang-2', 175, 600, 310, true);
  shadow(700, 318, 34); img(ata('siaga', BELT_NOW), 700 - 47, 318 - 113, 113, 'flip');
  shadow(575, 585, 96); img(IMG['ladhia/siaga'].src, 575 - 186, 585 - 264, 264, 'flip');
  shadow(700, 690, 44); img(IMG['bubunti/siaga'].src, 700 - 82, 690 - 150, 150, 'flip');
  ui('💥 Kumpul tenaga', 'intent big', at(175, 272));
  ui('🪨 Keras · 👑 Bos', 'tipe', at(175, 606));
  const faces = { a: ata('wajah'), r: IMG['musuh/raja-kumbang-1'].src, l: IMG['ladhia/wajah'].src, b: IMG['bubunti/wajah'].src };
  ui('<span class="lbl">GILIRAN</span>' + [['l', 'now'], ['r'], ['a'], ['b']].map(([k, c], i) =>
    (i ? '<span class="arrow">›</span>' : '') + `<div class="face ${c || ''} ${k === 'r' ? 'foe' : ''}"><img src="${faces[k]}" style="image-rendering:auto">`+'</div>').join(''), 'box', {}).id = 'turn';
  ui('<div class="lbl">BOS</div><div class="row"><span>Raja Kumbang</span><span>Fase 1</span></div><div class="bar hp" style="margin-top:6px"><b>HP</b><div class="t"><i style="width:64%;background:linear-gradient(#ff9a6a,#d0452f)"></i></div></div>', 'box', {}).id = 'foes';
  const p = ui('', '', {}); p.id = 'party';
  p.innerHTML = card(ata('wajah'), 'Ata', 7, 'Taekwondoin · 🟨 Kuning', 41, 64, 10, 17)
    + card(IMG['ladhia/wajah'].src, 'Ladhia', 7, 'Paladin', 90, 104, 6, 7, true)
    + card(IMG['bubunti/wajah'].src, 'Bubunti', 6, 'Chef', 30, 48, 19, 33);
  ui(`<div class="btn"><span class="ic">⚔️</span>Serang</div><div class="btn sel"><span class="ic">✨</span>Jurus</div><div class="btn"><span class="ic">🛡️</span>Bertahan</div><div class="btn"><span class="ic">🎒</span>Bekal</div><div class="btn"><span class="ic">🔄</span>Tukar</div><div class="btn"><span class="ic">🏃</span>Kabur</div>`, 'box', {}).id = 'menu';
  ui(`<div class="lbl">JURUS LADHIA</div>

     <p>Sabuk = senjata Ata. Naik level → ujian sabuk di dojo → ATK & SPD naik + jurus baru.</p>`, 'box', {}).id = 'sabuk';
